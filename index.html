<script>
  async function handleContact(e, formId) {
    e.preventDefault();

    const form = e.target;
    const btn = form.querySelector('button');
    const success = document.getElementById('success-' + formId);
    const error = document.getElementById('error-' + formId);

    const name = form.querySelector('[name="name"]').value.trim();
    const email = form.querySelector('[name="email"]').value.trim();
    const message = form.querySelector('[name="message"]').value.trim();

    btn.disabled = true;
    btn.textContent = 'Sending...';

    success.style.display = 'none';
    error.style.display = 'none';

    try {
      const res = await fetch('/api/contacted', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          name,
          email,
          message
        })
      });

      if (!res.ok) {
        throw new Error('Request failed');
      }

      success.style.display = 'block';
      form.reset();

      btn.textContent = 'Sent';

      setTimeout(() => {
        btn.disabled = false;
        btn.textContent = 'Send';
      }, 2000);

    } catch (err) {
      console.error(err);

      error.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Send';
    }
  }

  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
  }

  document.addEventListener('click', function(e) {
    const sidebar = document.getElementById('sidebar');
    const toggle = document.getElementById('mob-toggle');

    if (
      sidebar.classList.contains('open') &&
      !sidebar.contains(e.target) &&
      e.target !== toggle
    ) {
      sidebar.classList.remove('open');
    }
  });

  const sections = document.querySelectorAll('.section');
  const navLinks = document.querySelectorAll('#nav a');

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const id = entry.target.id;

        navLinks.forEach(a => {
          a.classList.toggle(
            'active',
            a.getAttribute('href') === '#' + id
          );
        });
      }
    });
  }, {
    rootMargin: '-20% 0px -70% 0px'
  });

  sections.forEach(section => observer.observe(section));

  navLinks.forEach(link => {
    link.addEventListener('click', e => {
      e.preventDefault();

      const target = document.querySelector(
        link.getAttribute('href')
      );

      if (target) {
        target.scrollIntoView({
          behavior: 'smooth',
          block: 'start'
        });

        if (window.innerWidth <= 768) {
          document
            .getElementById('sidebar')
            .classList.remove('open');
        }
      }
    });
  });
</script>
